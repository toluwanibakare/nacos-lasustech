# Render's free plan puts the backend to sleep after 15 minutes without traffic, and the next
# visitor waits about a minute for it to wake. This calls the health check every 5 minutes so it
# stays awake. The health check does no database or email work, so it is very cheap.
#
# If the backend does not answer after 3 tries the run fails and GitHub emails the person who
# last edited this schedule. Run it by hand any time from the Actions tab (Run workflow).
#
# Note: GitHub pauses scheduled workflows in a repository with no activity for 60 days. Any
# push re-enables them.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the backend health check
        env:
          URL: https://nacos-lasustech.onrender.com/api/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 70 -w "%{http_code}" "$URL" || true)
            echo "attempt $attempt: HTTP ${code:-none}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "The backend did not answer 200 after 3 tries."
          exit 1
