<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NACOS LASUSTECH | Official Website</title>
    <link rel="icon" type="image/png" href="/nacos_logo.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.ico" />
    <meta name="description" content="Official digital home for the Nigeria Association of Computing Students (NACOS), LASUSTECH Chapter. Empowering future tech leaders through innovation and community." />
    <meta name="author" content="NACOS LASUSTECH Chapter" />

    <meta property="og:title" content="NACOS LASUSTECH Website" />
    <meta property="og:description" content="The official platform for computing students at LASUSTECH. Access resources, pay dues, and join our tech community." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nacoslasustech" />
    <meta name="twitter:title" content="NACOS LASUSTECH Website" />
    <meta name="twitter:description" content="Empowering the next generation of computing leaders at LASUSTECH." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <!-- background (decorative) -->
      <div class="ls-bg" aria-hidden="true">
        <span class="ls-blob ls-blob-a"></span>
        <span class="ls-blob ls-blob-b"></span>
        <span class="ls-blob ls-blob-c"></span>
        <span class="ls-grid"></span>
      </div>

      <div class="ls-center">
        <!-- rings pulse out from behind the logo -->
        <div class="ls-rings" aria-hidden="true"><span></span><span></span><span></span></div>

      <div style="position:relative;width:80px;height:80px;transform-style:preserve-3d;animation:flip-horizontal 2.5s infinite linear">
        <!-- Front -->
        <div style="position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid rgba(31,95,175,0.3);background:linear-gradient(to bottom right, rgba(31,95,175,0.1), transparent);box-shadow:0 10px 25px rgba(0,0,0,0.1)">
          <img src="/src/assets/nacos_logo.png" alt="" style="width:50px;height:50px;object-fit:contain" />
        </div>
        <!-- Back -->
        <div style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid rgba(31,95,175,0.3);background:linear-gradient(to bottom right, rgba(31,95,175,0.1), transparent);box-shadow:0 10px 25px rgba(0,0,0,0.1)">
          <img src="/src/assets/lasustech_logo.png" alt="" style="width:50px;height:50px;object-fit:contain" />
        </div>
      </div>
        <p class="ls-name" style="margin-top:24px;color:rgba(8,17,29,0.7);font-size:12px;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;font-family:system-ui,sans-serif">NACOS LASUSTECH</p>
        <p class="ls-tag">Nigeria Association of Computing Students &middot; LASUSTECH Chapter</p>
      </div>

      <div class="ls-progress" aria-hidden="true"><span></span></div>

      <style>
        @keyframes flip-horizontal {
          0% { transform: rotateY(0deg); }
          100% { transform: rotateY(360deg); }
        }

        #loading-screen {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #ffffff; overflow: hidden;
          transition: transform 0.95s cubic-bezier(0.76, 0, 0.24, 1);
          will-change: transform;
        }
        /* leaves like a curtain, with a curved bottom edge */
        #loading-screen.ls-exit {
          transform: translateY(-104%);
          border-radius: 0 0 50% 50% / 0 0 90px 90px;
        }

        .ls-bg { position: absolute; inset: 0; pointer-events: none; }
        .ls-blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; animation: ls-drift 9s ease-in-out infinite; }
        .ls-blob-a { width: 46vmax; height: 46vmax; left: -14vmax; top: -16vmax; background: rgba(22,155,45,0.28); }
        .ls-blob-b { width: 42vmax; height: 42vmax; right: -14vmax; bottom: -16vmax; background: rgba(31,95,175,0.28); animation-delay: -4s; }
        .ls-blob-c { width: 26vmax; height: 26vmax; left: 52%; top: 8%; background: rgba(111,224,138,0.22); animation-delay: -7s; }
        .ls-grid {
          position: absolute; inset: 0;
          background-image: radial-gradient(rgba(8,17,29,0.12) 1px, transparent 1px);
          background-size: 26px 26px;
          -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 68%);
                  mask-image: radial-gradient(circle at center, #000 0%, transparent 68%);
        }
        @keyframes ls-drift {
          0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
          50% { transform: translate3d(4%, -5%, 0) scale(1.08); }
        }

        .ls-center { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .ls-center > .ls-rings + div { position: relative; z-index: 1; }

        .ls-rings { position: absolute; top: 0; left: 50%; width: 80px; height: 80px; margin-left: -40px; }
        .ls-rings span {
          position: absolute; inset: 0; border-radius: 50%;
          border: 1.5px solid rgba(31,95,175,0.35);
          animation: ls-ring 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
          opacity: 0;
        }
        .ls-rings span:nth-child(2) { animation-delay: 1s; border-color: rgba(22,155,45,0.35); }
        .ls-rings span:nth-child(3) { animation-delay: 2s; }
        @keyframes ls-ring {
          0% { transform: scale(1); opacity: 0.8; }
          100% { transform: scale(3.4); opacity: 0; }
        }

        .ls-name { opacity: 0; animation: ls-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards; }
        .ls-tag {
          margin-top: 10px; max-width: 80vw; text-align: center;
          color: rgba(8,17,29,0.45); font: 500 11px/1.5 system-ui, sans-serif; letter-spacing: 0.04em;
          opacity: 0; animation: ls-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
        }
        @keyframes ls-up {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .ls-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(8,17,29,0.06); }
        .ls-progress span {
          display: block; height: 100%; width: 100%; transform-origin: left center;
          background: linear-gradient(90deg, #169b2d, #1f5faf);
          animation: ls-fill 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform: scaleX(0);
        }
        @keyframes ls-fill { to { transform: scaleX(1); } }

        /* the page rises into place as the curtain leaves */
        body.splash-done #root { animation: app-in 1s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes app-in {
          from { opacity: 0.4; transform: translateY(22px) scale(0.99); }
          to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
          .ls-blob, .ls-rings span { animation: none; }
          .ls-rings { display: none; }
          #loading-screen { transition: opacity 0.4s ease; }
          #loading-screen.ls-exit { transform: none; opacity: 0; border-radius: 0; }
          body.splash-done #root { animation: none; }
        }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Wait for React to mount AND wait at least 3 seconds
      const startTime = Date.now();
      const hideLoader = () => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, 3000 - elapsed);
        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          if (loader) {
            document.body.classList.add('splash-done');
            loader.classList.add('ls-exit');
            setTimeout(() => loader.remove(), 1100);
          }
        }, remaining);
      };

      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          hideLoader();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
      // Fallback: remove loader after 8 seconds
      setTimeout(hideLoader, 8000);
    </script>
  </body>
</html>
